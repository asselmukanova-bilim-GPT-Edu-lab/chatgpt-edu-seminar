<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вебинар для школ «Дарын»</title><link rel="stylesheet" href="webinar.css"></head><body>
<header class="appbar"><span>BilimAI <span class="muted">/ Вебинар для школ «Дарын»</span></span><nav><button id="menu">Содержание</button><button id="notes">Заметки ведущего</button><span class="mainlang"><a href="index.html" data-main-language="ru" lang="ru">RU</a><a href="index-kk.html" data-main-language="kk" lang="kk">KK</a></span><button id="fullscreen" aria-label="Полный экран">⛶</button></nav></header>
<main id="viewport"><article id="slide" aria-live="polite"></article></main>
<footer class="controls"><button id="prev" aria-label="Предыдущий слайд">←</button><span id="counter"></span><span id="timing"></span><div class="progress" aria-label="Прогресс"><div id="progress"></div></div><button id="next" aria-label="Следующий слайд">→</button></footer>
<dialog id="menuDialog"><button class="close" data-close>Закрыть ✕</button><h2>Содержание · 31 слайдов · 60 минут</h2><div id="menuItems"></div></dialog>
<dialog id="notesDialog"><button class="close" data-close>Закрыть ✕</button><div id="noteContent"></div></dialog>
<dialog id="topicDialog"><button class="close" data-close>Закрыть ✕</button><div id="topicContent"></div></dialog>
<dialog id="viewer"><div class="viewerbar"><button id="return">← Вернуться к презентации</button><strong id="viewerTitle"></strong><div id="viewerLang"></div><a id="standalone" target="_blank" rel="noopener">Открыть отдельно ↗</a></div><div id="frames"></div></dialog>
<dialog id="practiceDialog"><button class="close" data-close>Вернуться к презентации ✕</button><h2>Подготовьте запрос по своему предмету</h2><form id="practiceForm"><div id="practiceFields"></div><label>Готовый запрос<textarea id="practiceOutput" rows="7" readonly></textarea></label><div class="actions"><button type="submit" class="primary">Собрать запрос</button><button type="button" id="copyPractice">Скопировать</button><button type="reset">Сбросить</button></div><p id="practiceStatus" role="status"></p></form></dialog>
<div id="toast" role="status"></div><script src="slides.js"></script><script src="webinar.js"></script></body></html>
