<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Улучшите запрос</title><style>*{box-sizing:border-box}body{font:19px Arial,sans-serif;color:#18233a;background:#f5f6fa url('resources/part-1/media/eb3c6ad741aba75da061fdea.png') center/cover;margin:0;padding:28px}main{max-width:1100px;margin:auto}h1{font-size:34px;margin:10px 0}p{line-height:1.5}.label{font-size:15px;color:#555f77}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;margin:16px 0;font-weight:bold}input,textarea{font:18px Arial;width:100%;padding:12px;border:1px solid #acb8d0;border-radius:5px;margin-top:7px}textarea{line-height:1.5;min-height:150px}button{font:18px Arial;padding:11px 18px;cursor:pointer;border:1px solid #aebbd3;background:white;border-radius:6px;margin:4px}button:first-child{background:#3033ed;color:white;border-color:#3033ed}#feedback{padding:16px;background:#fff;border-left:4px solid #3436ed;margin:14px 0;line-height:1.6}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2693b2;outline-offset:2px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><p class="label">МИНИ-ПРАКТИКА · ЛОКАЛЬНАЯ АЛЬТЕРНАТИВА PADLET</p><h1>От общего запроса к понятной задаче</h1><p>Исходный запрос: <b>«Сделай интересный урок»</b>. Уточните данные, соберите запрос и проверьте его. Ваши ответы остаются в этом окне.</p><form id="form"><div class="row"><label>Предмет, класс, тема<input id="context" placeholder="Например: информатика, 9 класс, алгоритмы поиска"></label><label>Точная учебная цель<input id="goal" placeholder="Вставьте цель из программы"></label><label>Действие ученика<input id="action" placeholder="Сравнить решения и обосновать выбор"></label><label>Формат и критерий результата<input id="format" placeholder="Три задания, ответы и критерии"></label></div><label>Готовый запрос<textarea id="output" readonly></textarea></label><div><button type="submit">Собрать запрос</button><button type="button" id="check">Проверить</button><button type="button" id="copy">Скопировать</button><button type="reset">Сбросить</button></div><div id="feedback" role="status">Заполните уточнения. Если затрудняетесь, начните с цели и действия ученика.</div></form></main><script>
const $=s=>document.querySelector(s),ids=['context','goal','action','format'];function build(){return `Подготовь материал: ${$('#context').value.trim()||'[предмет, класс, тема]'}. Учебная цель: ${$('#goal').value.trim()||'[точная цель]'}. Действие ученика: ${$('#action').value.trim()||'[действие]'}. Формат и проверка: ${$('#format').value.trim()||'[формат и критерии]'}. Добавь подсказку при затруднении. Используй проверенные исходные материалы. Если данных недостаточно, уточни их.`}$('#form').onsubmit=e=>{e.preventDefault();$('#output').value=build();$('#feedback').textContent='Запрос собран. Нажмите «Проверить» и уточните пропуски.'};$('#check').onclick=()=>{let missing=ids.filter(x=>!$('#'+x).value.trim());$('#feedback').textContent=missing.length?'Ещё нужно уточнить: '+missing.map(x=>({context:'предмет, класс и тему',goal:'точную учебную цель',action:'действие ученика',format:'формат и критерий результата'}[x])).join('; ')+'. Подсказка: опишите, что ученик должен сделать и как будет проверен результат.':'Все четыре части заполнены. Сверьте цель с программой. Проверьте, оценивается ли рассуждение, а не только готовый ответ.'};$('#copy').onclick=async()=>{if(!$('#output').value)$('#output').value=build();try{await navigator.clipboard.writeText($('#output').value);$('#feedback').textContent='Запрос скопирован.'}catch{$('#output').select();let ok=document.execCommand('copy');$('#feedback').textContent=ok?'Запрос скопирован.':'Выделите текст и скопируйте вручную.'}};$('#form').onreset=()=>setTimeout(()=>{$('#output').value='';$('#feedback').textContent='Задание сброшено. Начните с цели и действия ученика.'},0);
</script></body></html>
