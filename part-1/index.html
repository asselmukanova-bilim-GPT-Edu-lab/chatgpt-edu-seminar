const privacyState=privacyCases.map(()=>({choice:null,hint:false,reveal:false,safe:false,safeChoice:null,safeReveal:false,anon:false}));
function privacyChoices(i,safe=false){const state=privacyState[i],choice=safe?state.safeChoice:state.choice;return `<div class="privacy-choices">${[tr('Можно','Болады'),tr('Нельзя','Болмайды')].map((label,j)=>`<button data-action="privacy-${safe?'safe-':''}choose:${i}:${j}" aria-pressed="${choice===j}" class="${choice===j?'active':''}">${label}</button>`).join('')}</div>`;}

function showPrivacyCase(i){const c=privacyCases[i];if(!c)return;const html='<section class="privacy-result"><h3>'+tr('Правильный ответ: нельзя','Дұрыс жауап: болмайды')+'</h3><p>'+c.no[lang]+'</p></section>'+privacyLawHTML(i);modal(tr('Ситуация ','Жағдай ')+(i+1)+' · '+c.title[lang],'<div class="privacy-detail">'+html+'</div>');$('#dialog').classList.add('privacy-dialog');}
function privacyAction(a,x,y){const i=+x,st=privacyState[i];if(a==='privacy-reset'){privacyState.forEach(s=>Object.assign(s,{choice:null,hint:false,reveal:false,safe:false,safeChoice:null,safeReveal:false,anon:false}));render();return;}
 if(!st)return;const wasOpen=$('#dialog').open,scroll=$('#dialogBody').scrollTop;
 if(a==='privacy-choose'){st.choice=+y;if(!wasOpen){render();return;}}
 if(a==='privacy-safe-choose')st.safeChoice=+y;
 if(a==='privacy-hint')st.hint=!st.hint;
 if(a==='privacy-answer')st.reveal=true;
 if(a==='privacy-safe')st.safe=true;
 if(a==='privacy-safe-answer')st.safeReveal=true;
 if(a==='privacy-anon')st.anon=true;
 showPrivacyCase(i);$('#dialogBody').scrollTop=wasOpen?scroll:0;
}

function showEthicsExpanded(n,tab=0){
 const d=ethicsExpanded[n];if(!d)return;
 const tile=(item,i)=>`<article class="ethics-tile"><span class="ethics-step">${String(i+1).padStart(2,'0')}</span><div><h3>${item[0][lang]}</h3><p>${item[1][lang]}</p></div></article>`;
 let html='';
 if(n===0)html=`<p class="ethics-intro">${d.intro[lang]}</p><div class="ethics-stair">${d.items.map(tile).join('')}</div>`;
 if(n===1)html=`<nav class="ethics-tabs" aria-label="${tr('Раздел данных','Деректер бөлімі')}">${btn(tr('Что нельзя загружать','Нені жүктеуге болмайды'),'ethicsdetail:1:0',tab===0?'active':'')}${btn(tr('Как обезличить промпт','Промптты иесіздендіру'),'ethicsdetail:1:1',tab===1?'active':'')}</nav><p class="ethics-intro">${tab===0?d.intro[lang]:tr('Три шага перед отправкой запроса','Сұранысты жіберуге дейінгі үш қадам')}</p><div class="${tab===0?'ethics-protected':'ethics-stair'}">${(tab===0?d.items:d.steps).map(tile).join('')}</div>${tab===0?`<p class="ethics-footnote">${tr('Правила из предоставленного материала семинара. Для учебных примеров используйте вымышленные или обезличенные данные.','Семинарға берілген материалдағы ережелер. Оқу мысалдары үшін ойдан шығарылған немесе иесіздендірілген деректерді пайдаланыңыз.')}</p>`:''}`;
 if(n===2)html=`<p class="ethics-intro">${d.intro[lang]}</p><div class="ethics-cycle"><div class="ethics-core">${tr('Решение<br>за педагогом','Шешімді<br>педагог қабылдайды')}</div>${d.items.map(tile).join('')}</div><p class="ethics-footnote">${tr('Если найдена ошибка, исправьте материал и повторите проверку перед уроком.','Қате табылса, материалды түзетіп, сабаққа дейін қайта тексеріңіз.')}</p>`;
 modal(d.title[lang],`<div class="ethics-detail">${html}</div>`);$('#dialog').classList.add('ethics-dialog');$('#dialogBody').scrollTop=0;
}

return builderPrompt();}

async function copy(text){try{await navigator.clipboard.writeText(text);toast(tr('Скопировано','Көшірілді'))}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();if(ok)toast(tr('Скопировано','Көшірілді'));else modal(tr('Скопируйте текст вручную','Мәтінді қолмен көшіріңіз'),`<textarea rows="12">${esc(text)}</textarea>`);}}

function miniFile(){const e=editorValues(),texts=lang?{title:'Оқу тапсырмасы',label:'Жауап',check:'Тексеру',reset:'Қайта бастау',empty:'Алдымен жауап жазыңыз.',yes:'Дұрыс!',no:'Әзірге қате. Қайталап көріңіз.',rule:'Мысалы: 3/4. Ұпай бірінші жауапқа беріледі.',score:'Бірінші жауап ұпайы'}:{title:'Учебное задание',label:'Ответ',check:'Проверить',reset:'Сначала',empty:'Сначала введите ответ.',yes:'Верно!',no:'Пока неверно. Попробуйте ещё.',rule:'Например: 3/4. Балл за первый ответ.',score:'Балл за первый ответ'};const data=JSON.stringify({e,texts}).replace(/</g,'\\u003c');return `<!doctype html><html lang="${lang?'kk':'ru'}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${texts.title}</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f8fafc;color:#0f172a}main{max-width:620px;margin:0 auto}h1{font-size:24px}input,button{font:inherit;border:1px solid #64748b;padding:10px;border-radius:8px;margin-top:8px;max-width:100%}input{width:100%}button{cursor:pointer;background:#0f172a;color:white}button:focus-visible,input:focus-visible{outline:3px solid #168bd2}p{line-height:1.5}small{color:#475569}</style><main><h1>${esc(e.q)}</h1><form><label for="answer">${texts.label}</label><input id="answer" autocomplete="off"><small>${texts.rule}</small><div><button type="submit">${texts.check}</button> <button type="button" id="reset">${texts.reset}</button></div></form><p id="feedback" role="status"></p><small id="score"></small></main><script>const {e,texts}=${data};let first=null;const a=document.getElementById('answer'),f=document.getElementById('feedback'),s=document.getElementById('score');const norm=v=>v.trim().toLocaleLowerCase().replace(/\\s+/g,'').replace(/,/g,'.');document.querySelector('form').onsubmit=ev=>{ev.preventDefault();if(!a.value.trim()){f.textContent=texts.empty;return}const good=norm(a.value)===norm(e.answer);if(first===null)first=good?1:0;f.textContent=(good?texts.yes:texts.no)+' '+e.why;s.textContent=texts.score+': '+first+' / 1'};document.getElementById('reset').onclick=()=>{first=null;a.value='';f.textContent='';s.textContent='';a.focus()};<\/script></html>`;}
function editorHTML(){let e=editorValues();return `<div class="editor"><form id="editorForm"><label class="field">${tr('Вопрос','Сұрақ')}<input data-edit="q" value="${esc(e.q)}" maxlength="160"></label><label class="field">${tr('Точный ответ','Дәл жауап')}<input data-edit="answer" value="${esc(e.answer)}" maxlength="80"></label><label class="field">${tr('Объяснение','Түсіндірме')}<textarea data-edit="why" maxlength="400">${esc(e.why)}</textarea></label><div class="actions">${btn(tr('Обновить','Жаңарту'),'preview','primary')}${btn(tr('Скачать HTML','HTML жүктеу'),'download')}${btn(tr('Промпт','Промпт'),'prompt:html','small-btn')}</div></form><div><div class="preview-title">${tr('Локальный шаблон · без генерации ИИ','Жергілікті үлгі · ЖИ генерациясынсыз')}</div><iframe id="preview" title="${tr('Предпросмотр задания','Тапсырма көрінісі')}" sandbox="allow-scripts allow-forms"></iframe></div></div>`}

function resourcesHTML(){return `<div class="resourcebox"><div><p class="hint">${tr('Материалы проекта','Жоба материалдары')}</p>${link('https://bilimai.kz/resources','bilimai.kz/resources','link-large')}<p class="fine">${tr('Внешняя ссылка: нужен интернет','Сыртқы сілтеме: интернет қажет')}</p></div><img class="qr" src="media/54c9e78ec0ff38ec1fbac344.gif" alt="QR bilimai.kz/resources"></div><div class="actions">${btn(tr('Шаблон промпта','Промпт үлгісі'),'prompt:html')}${btn(tr('Редактор задания','Тапсырма редакторы'),'goto:39')}${btn(tr('Официальные источники','Ресми дереккөздер'),'sources')}</div>`}

case 'image':return `<div class="split"><img class="demo-image" src="media/eb3c6ad741aba75da061fdea.png" alt="${tr('Светлый фон с орнаментом','Оюлы ашық фон')}"><div><div class="promptline">${tr('Фон 16:9. Светлый орнамент. Без текста.','16:9 фон. Ашық ою. Мәтінсіз.')}</div><p class="fine">${tr('Готовый файл из материалов семинара','Семинар материалдарындағы дайын файл')}</p></div></div>`;
case 'work':return `<div class="flow"><div><b>01</b>${tr('Задание и источник','Тапсырма мен дереккөз')}</div><div><b>02</b>${tr('Готовый материал','Дайын материал')}</div><div><b>03</b>${tr('Сверка с целью','Мақсатпен салыстыру')}</div></div>${btn(tr('Открыть готовый пример','Дайын үлгіні ашу'),'workdemo','primary')}`;
case 'prompt-foundation':return promptFoundationHTML();
case 'codex':return codexOverviewHTML();

case 'promptbuilder':return builderHTML();
case 'revision':return `<div class="split"><div class="exercise"><span class="pill">${tr(S.rev?'После правки':'До правки',S.rev?'Түзетуден кейін':'Түзетуге дейін')}</span><p class="formula">1/4 + 2/4 = ${S.rev?'3/4':'3/8'}</p><p class="hint">${tr(S.rev?'Знаменатель сохраняем.':'В ключе есть ошибка.',S.rev?'Бөлімін сақтаймыз.':'Кілтте қате бар.')}</p></div><div class="stack"><div class="promptline">${tr('Исправь ключ. Сохрани вопрос. Объясни расчёт.','Кілтті түзет. Сұрақты сақта. Есептеуді түсіндір.')}</div>${btn(tr(S.rev?'Исходная версия':'Применить правку',S.rev?'Бастапқы нұсқа':'Түзетуді қолдану'),'revision','primary')}</div></div>`;
case 'walkthrough':return `<div class="tabs">${[['Запрос','Сұраныс'],['Ответ','Жауап'],['Проверка','Тексеру'],['Исправление','Түзету']].map((x,i)=>btn('0'+(i+1)+' '+x[lang],`walk:${i}`,S.walk===i?'active':'')).join('')}</div><div class="promptline">${walkText()[S.walk]}</div><p class="fine">${tr('Подготовленный сквозной пример','Алдын ала дайындалған тұтас мысал')}</p>`;
case 'ustaz':case 'tarbie':return cards(s)+btn(tr('Запрос и пример результата','Сұраныс пен нәтиже үлгісі'),s.kind+'demo','primary');
case 'match':return matchHTML();case 'fractions':return fraction('math');case 'physics':return physicsHTML();case 'water':return orderHTML('water');case 'language':return languageHTML();case 'history':return orderHTML('history');
case 'htmlprompt':return `<div class="grid"><div class="card"><span class="num">01</span><p>${tr('Цель, источник, действие','Мақсат, дереккөз, әрекет')}</p></div><div class="card"><span class="num">02</span><p>${tr('Обратная связь и перезапуск','Кері байланыс пен қайта бастау')}</p></div><div class="card"><span class="num">03</span><p>${tr('Один файл и проверка','Бір файл және тексеру')}</p></div></div>${btn(tr('Открыть и скопировать шаблон','Үлгіні ашып көшіру'),'prompt:html','primary')}`;

case 'access':return `<table class="table"><thead><tr><th>${tr('Роль','Рөл')}</th><th>${tr('Возможность','Мүмкіндік')}</th><th>${tr('Показ','Көрсету')}</th></tr></thead><tbody>${[['Просмотр','Қарау','Читать','Оқу'],['Комментарии','Пікірлер','Обсуждать','Талқылау'],['Редактирование','Өңдеу','Изменять содержание','Мазмұнды өзгерту']].map((x,i)=>`<tr><td>${x[lang]}</td><td>${x[lang+2]}</td><td>${btn(tr('Проверить роль','Рөлді тексеру'),`access:${i}`,'small-btn')}</td></tr>`).join('')}</tbody></table><p class="fine">${tr('Учебная модель прав. Реальный доступ здесь не меняется.','Рұқсаттардың оқу үлгісі. Нақты қолжетімділік өзгермейді.')}</p>`;
case 'champions':return `<div class="split"><div><div class="metric">Advanced</div><p class="big-text">${tr('Применять. Проверять.<br>Делиться опытом.','Қолдану. Тексеру.<br>Тәжірибемен бөлісу.')}</p>${link('https://bilimai.kz/champions','bilimai.kz/champions','link-large')}</div><div><img class="qr" style="background:white;padding:8px;width:190px;height:190px" src="media/94490e0795e547c1f67ba60d.gif" alt="QR bilimai.kz/champions"><p class="fine">${tr('Сроки, отбор и условия уточняйте у организаторов.','Мерзім, іріктеу мен шарттарды ұйымдастырушылардан нақтылаңыз.')}</p></div></div>`;

function walkText(){return lang?['5-сыныпқа бөлімдері бірдей бөлшектерді қосуға 3 тапсырма жаса. Кілтті бөлек бер. 7 минут.','1/5 + 2/5; 2/7 + 3/7; 3/8 + 1/8.<br>Бастапқы кілт: 3/5; 5/14; 4/8.','Екінші жауап қате: бөлім 7 болып қалады.<br>Уақыт пен нұсқауды мұғалім тексереді.','Тек екінші кілтті 5/7 деп түзет.<br>Толық кілт: 3/5; 5/7; 4/8 = 1/2.']:['Создай 3 задания на сложение дробей с одинаковым знаменателем, 5 класс. Ключ отдельно. Время: 7 минут.','1/5 + 2/5; 2/7 + 3/7; 3/8 + 1/8.<br>Исходный ключ: 3/5; 5/14; 4/8.','Второй ответ неверен: знаменатель остаётся 7.<br>Время и инструкцию проверяет учитель.','Исправь только второй ключ на 5/7.<br>Полный ключ: 3/5; 5/7; 4/8 = 1/2.'];}

{title:['Workspace — рабочая среда','Workspace — жұмыс ортасы'],text:['Это среда ChatGPT, в которой вы сейчас работаете: личная или предоставленная вашей организацией. От выбранного Workspace зависят доступные инструменты и настройки. Аккаунт — это ваша учётная запись, а Workspace — среда, которую вы выбираете внутри неё.','Бұл — сіз қазір жұмыс істеп отырған ChatGPT ортасы: жеке немесе ұйымыңыз ұсынған орта. Қолжетімді құралдар мен баптаулар таңдалған Workspace-ке байланысты. Аккаунт — сіздің тіркелгіңіз, ал Workspace — сол тіркелгі ішінде таңдайтын жұмыс ортасы.'],example:['Учитель входит в свой аккаунт и выбирает рабочее пространство организации для работы в ChatGPT Edu.','Мұғалім өз аккаунтына кіріп, ChatGPT Edu-да жұмыс істеу үшін ұйымның жұмыс кеңістігін таңдайды.'],url:'https://learn.chatgpt.com/docs/space'},

{title:['Персонализация — настройка помощника под себя','Жекелендіру — көмекшіні өзіңізге бейімдеу'],text:['Позволяет указать, как ChatGPT должен с вами общаться: на каком языке, насколько подробно и в каком стиле. При включённой памяти он может учитывать полезную информацию из предыдущих бесед.','ChatGPT сізбен қай тілде, қаншалықты егжей-тегжейлі және қандай стильде сөйлесуі керегін көрсетуге мүмкіндік береді. Жад қосулы болса, ол алдыңғы әңгімелердегі пайдалы ақпаратты ескере алады.'],example:['«Я учитель информатики. Отвечай на русском языке, объясняй простыми словами и приводи примеры для 7 класса».','«Мен информатика мұғалімімін. Орыс тілінде жауап бер, қарапайым сөздермен түсіндір және 7-сыныпқа арналған мысалдар келтір».'],after:['Эти настройки можно изменять.','Бұл баптауларды өзгертуге болады.'],url:'https://learn.chatgpt.com/docs/personalize'},
{title:['Space и Page — место для материалов и отдельная страница','Space және Page — материалдар кеңістігі және жеке бет'],text:['Space можно представить как тематическую папку, объединяющую страницы. Page — отдельная страница, которую можно писать и редактировать вместе с ChatGPT. На ней удобно размещать текст, планы и другие материалы, а также предоставлять коллегам доступ для совместной работы.','Space-ті беттерді біріктіретін тақырыптық қалта ретінде елестетуге болады. Page — ChatGPT-пен бірге жазып, өңдеуге болатын жеке бет. Онда мәтін, жоспарлар және басқа материалдарды орналастырып, бірлесіп жұмыс істеу үшін әріптестерге қолжетімділік беруге болады.'],example:['Space «Методическая работа» содержит страницы «План вебинара», «Инструкции для учителей» и «Полезные материалы».','«Әдістемелік жұмыс» Space кеңістігінде «Вебинар жоспары», «Мұғалімдерге арналған нұсқаулықтар» және «Пайдалы материалдар» беттері бар.'],url:'https://learn.chatgpt.com/docs/space'},
{title:['Project — организация длительной работы над темой','Project — тақырып бойынша ұзақ мерзімді жұмысты ұйымдастыру'],text:['Проект объединяет связанные чаты, файлы, источники и общие инструкции. Он удобен, когда к одной теме нужно возвращаться несколько раз и создавать разные материалы на основе одних документов.','Жоба өзара байланысты чаттарды, файлдарды, дереккөздерді және ортақ нұсқауларды біріктіреді. Бір тақырыпқа бірнеше рет оралып, бір құжаттар негізінде әртүрлі материалдар жасау қажет болғанда ыңғайлы.'],example:['В проект «Физика, 7 класс» можно добавить учебную программу и КТП, а затем вести отдельные чаты для подготовки планов уроков, рабочих листов и презентаций.','«Физика, 7-сынып» жобасына оқу бағдарламасы мен күнтізбелік-тақырыптық жоспарды қосып, кейін сабақ жоспарларын, жұмыс парақтарын және презентацияларды дайындау үшін жеке чаттар жүргізуге болады.']}
];}
function showEduDetail(i){const details=eduDetails();if(!details[i])return;const pictures=['media/06d128171ec53920d0ea990f.png','media/24371137b9374c5885b6ca63.png','media/440f33902f83cae5f608d80f.png','media/3258b7821bf5d5002d324750.png','media/d186c31ef4fdaa25d2bdd726.png'];const ids=i===0?[0,1]:[i];const title=i===0?tr('Workspace, чат и режим «Работа»','Workspace, чат және «Жұмыс» режимі'):details[i].title[lang];const body=ids.map(n=>{const d=details[n];return '<section class="edu-detail">'+(ids.length>1?'<h3 class="edu-detail-heading">'+esc(d.title[lang])+'</h3>':'')+'<img class="edu-topic-image" src="'+pictures[n]+'" alt="'+esc(d.title[lang])+'"><p>'+esc(d.text[lang])+'</p>'+(d.extra?'<p>'+esc(d.extra[lang])+'</p>':'')+'<section class="edu-example"><h3>'+tr(n===2?'Пример инструкции':'Пример',n===2?'Нұсқау мысалы':'Мысал')+'</h3><p>'+esc(d.example[lang])+'</p></section>'+(d.after?'<p>'+esc(d.after[lang])+'</p>':'')+(d.url?'<a class="edu-source" href="'+d.url+'" target="_blank" rel="noopener noreferrer">ChatGPT Learn ↗</a>':'')+'</section>';}).join('');modal(title,body);$('#dialogBody').scrollTop=0;}
