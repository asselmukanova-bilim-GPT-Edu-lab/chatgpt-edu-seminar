const privacyState=privacyCases.map(()=>({choice:null,hint:false,reveal:false,safe:false,safeChoice:null,safeReveal:false,anon:false}));
function privacyChoices(i,safe=false){const state=privacyState[i],choice=safe?state.safeChoice:state.choice;return `<div class="privacy-choices">${[tr('Можно','Болады'),tr('Нельзя','Болмайды')].map((label,j)=>`<button data-action="privacy-${safe?'safe-':''}choose:${i}:${j}" aria-pressed="${choice===j}" class="${choice===j?'active':''}">${label}</button>`).join('')}</div>`;}
function privacyCardsHTML(){return `<div class="privacy-grid">${privacyCases.map((c,i)=>`<article class="privacy-card"><span class="privacy-number">0${i+1}</span><button class="privacy-heading" data-action="privacy-open:${i}">${c.title[lang]}</button><p>${c.text[lang]}</p>${privacyChoices(i)}${btn(tr('Правильный ответ','Дұрыс жауап'),`privacy-answer:${i}`,'privacy-reveal')}</article>`).join('')}</div><div class="privacy-instruction">${btn(tr('Сбросить ответы','Жауаптарды тазарту'),'privacy-reset','small-btn')}</div>`;}
function privacyLawHTML(i){return `<section class="privacy-law"><h3>${tr('Правовое основание','Құқықтық негіз')}</h3><p>${tr('Закон требует законного основания обработки, соблюдения порядка согласия и конфиденциальности. Учебная цель не отменяет эти требования.','Заң деректерді өңдеудің заңды негізін, келісім тәртібі мен құпиялылықты сақтауды талап етеді. Оқу мақсаты бұл талаптарды жоймайды.')}</p><ul><li>${link('https://adilet.zan.kz/rus/docs/Z1300000094',tr('«О персональных данных и их защите» — статьи 7, 8, 11','«Дербес деректер және оларды қорғау туралы» — 7, 8, 11-баптар'))}</li><li>${i===1?link('https://adilet.zan.kz/rus/docs/K1400000226',tr('УК РК — статья 147: при наличии состава преступления','ҚР ҚК — 147-бап: қылмыс құрамы болғанда')):link('https://adilet.zan.kz/rus/docs/K1400000235',tr('КоАП РК — статья 79: нарушение требований к персональным данным','ҚР ӘҚБтК — 79-бап: дербес деректер талаптарын бұзу'))}</li><li>${link('https://adilet.zan.kz/rus/docs/V2000020619',tr('Приказ № 190 — педагогическая этика','№ 190 бұйрық — педагогикалық әдеп'))}</li><li>${link('https://adilet.zan.kz/rus/docs/Z1900000293',tr('«О статусе педагога» — статья 5','«Педагог мәртебесі туралы» — 5-бап'))}</li></ul><p class="fine">${tr('Конкретная ответственность зависит от обстоятельств и состава нарушения. Она не наступает автоматически за любое использование ИИ. Это разбор заданной ситуации, а не универсальный запрет на ИИ.','Нақты жауапкершілік мән-жайлар мен құқық бұзушылық құрамына байланысты. ЖИ-ді кез келген қолдану автоматты түрде жауапкершілік туғызбайды. Бұл ЖИ-ге жалпы тыйым емес, берілген жағдайды талдау.')}</p></section>`;}
function showPrivacyCase(i){const c=privacyCases[i];if(!c)return;const html='<section class="privacy-result"><h3>'+tr('Правильный ответ: нельзя','Дұрыс жауап: болмайды')+'</h3><p>'+c.no[lang]+'</p></section>'+privacyLawHTML(i);modal(tr('Ситуация ','Жағдай ')+(i+1)+' · '+c.title[lang],'<div class="privacy-detail">'+html+'</div>');$('#dialog').classList.add('privacy-dialog');}
function privacyAction(a,x,y){const i=+x,st=privacyState[i];if(a==='privacy-reset'){privacyState.forEach(s=>Object.assign(s,{choice:null,hint:false,reveal:false,safe:false,safeChoice:null,safeReveal:false,anon:false}));render();return;}
 if(!st)return;const wasOpen=$('#dialog').open,scroll=$('#dialogBody').scrollTop;
 if(a==='privacy-choose'){st.choice=+y;if(!wasOpen){render();return;}}
 if(a==='privacy-safe-choose')st.safeChoice=+y;
 if(a==='privacy-hint')st.hint=!st.hint;
 if(a==='privacy-answer')st.reveal=true;
 if(a==='privacy-safe')st.safe=true;
 if(a==='privacy-safe-answer')st.safeReveal=true;
 if(a==='privacy-anon')st.anon=true;
 showPrivacyCase(i);$('#dialogBody').scrollTop=wasOpen?scroll:0;
}

function miniFile(){const e=editorValues(),texts=lang?{title:'Оқу тапсырмасы',label:'Жауап',check:'Тексеру',reset:'Қайта бастау',empty:'Алдымен жауап жазыңыз.',yes:'Дұрыс!',no:'Әзірге қате. Қайталап көріңіз.',rule:'Мысалы: 3/4. Ұпай бірінші жауапқа беріледі.',score:'Бірінші жауап ұпайы'}:{title:'Учебное задание',label:'Ответ',check:'Проверить',reset:'Сначала',empty:'Сначала введите ответ.',yes:'Верно!',no:'Пока неверно. Попробуйте ещё.',rule:'Например: 3/4. Балл за первый ответ.',score:'Балл за первый ответ'};const data=JSON.stringify({e,texts}).replace(/</g,'\\u003c');return `<!doctype html><html lang="${lang?'kk':'ru'}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${texts.title}</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f8fafc;color:#0f172a}main{max-width:620px;margin:0 auto}h1{font-size:24px}input,button{font:inherit;border:1px solid #64748b;padding:10px;border-radius:8px;margin-top:8px;max-width:100%}input{width:100%}button{cursor:pointer;background:#0f172a;color:white}button:focus-visible,input:focus-visible{outline:3px solid #168bd2}p{line-height:1.5}small{color:#475569}</style><main><h1>${esc(e.q)}</h1><form><label for="answer">${texts.label}</label><input id="answer" autocomplete="off"><small>${texts.rule}</small><div><button type="submit">${texts.check}</button> <button type="button" id="reset">${texts.reset}</button></div></form><p id="feedback" role="status"></p><small id="score"></small></main><script>const {e,texts}=${data};let first=null;const a=document.getElementById('answer'),f=document.getElementById('feedback'),s=document.getElementById('score');const norm=v=>v.trim().toLocaleLowerCase().replace(/\\s+/g,'').replace(/,/g,'.');document.querySelector('form').onsubmit=ev=>{ev.preventDefault();if(!a.value.trim()){f.textContent=texts.empty;return}const good=norm(a.value)===norm(e.answer);if(first===null)first=good?1:0;f.textContent=(good?texts.yes:texts.no)+' '+e.why;s.textContent=texts.score+': '+first+' / 1'};document.getElementById('reset').onclick=()=>{first=null;a.value='';f.textContent='';s.textContent='';a.focus()};<\/script></html>`;}

function workGameHTML(step){
 const ribbon=`<div class="wg-ribbon"><strong>Этап ${step} / 3 · ${[10,5,15][step-1]} минут</strong><span>Работа в парах</span></div>`;
 if(step===1)return ribbon+`<p class="wg-instruction">Выберите документ, который понадобится Вам в ближайшие две недели. Создайте первую версию с помощью подходящего плагина.</p><table class="wg-table"><thead><tr><th>Плагин</th><th>Документ</th><th>Требования</th></tr></thead><tbody>${workChoices.map((x,i)=>`<tr class="${workGame.doc===i?'selected':''}"><td>${x[0]}</td><td><button data-action="wg-doc:${i}" aria-pressed="${workGame.doc===i}">${x[1]} ${workGame.doc===i?'✓':''}</button></td><td>${x[2]}</td></tr>`).join('')}</tbody></table><ol class="wg-steps"><li>Выберите класс, тему и задачу.</li><li>Укажите язык, время, условия и формат результата.</li><li>Составьте запрос и создайте документ.</li></ol><div class="wg-alert">По предмету используйте точную цель обучения из своего плана или программы. Не вводите персональные данные учеников.</div><div class="wg-bottom"><button class="primary" data-action="wg-template">Шаблон запроса</button></div>`;
 if(step===2)return ribbon+`<p class="wg-instruction">Покажите документ соседу. Прочитайте его глазами ученика или родителя.</p><div class="wg-review">${['Понятно ли, что нужно сделать?','Соответствует ли материал заявленной цели?','Реально ли выполнить задание за указанное время?','Что нужно проверить или исправить перед использованием?'].map((q,i)=>`<div><b>0${i+1}</b><p>${q}</p></div>`).join('')}</div><p class="wg-task">Назовите одно конкретное замечание и предложите улучшение.</p><div class="wg-feedback"><div><small>Общее замечание</small><p>«Сделайте интереснее».</p></div><div><small>Полезное замечание</small><p>«Во втором задании не указано, что нужно сравнить. Добавьте объекты и признаки сравнения».</p></div></div><label class="wg-note">Запишите конкретное замечание и улучшение<textarea id="wgNote" placeholder="Коллега заметил… Предлагаем…">${esc(workGame.notes)}</textarea></label><div class="wg-alert">Автор записывает замечание и решает, как его учесть.</div>`;
 return ribbon+`<p class="wg-instruction">Выберите подходящее изменение условий. Доработайте документ, сохранив его основную цель.</p><div class="wg-phases"><span><b>6 минут</b> — доработка</span><span><b>5 минут</b> — повторная проверка в паре</span><span><b>4 минуты</b> — короткие выступления</span></div><div class="wg-adapt"><section><label class="wg-select">Тип документа<select id="wgType">${workChoices.map((x,i)=>`<option value="${i}" ${workGame.doc===i?'selected':''}>${x[1]}</option>`).join('')}</select></label><div class="wg-condition" aria-live="polite">${workGame.condition===null?'<span>Условие появится после нажатия кнопки.</span>':`${workConditionHTML(workGame.condition)}`}</div><div class="wg-buttons"><button class="primary" data-action="wg-random">Получить условие</button><button data-action="wg-list">Выбрать из списка</button></div><p class="wg-fine">Каждая пара может выбрать своё условие из списка — выбор ведущего не обязателен.</p><ol><li>Объясните плагину, что изменилось.</li><li>Получите новую версию.</li><li>Проверьте её и сохраните документ.</li></ol></section><section class="wg-final"><h2>Выступление · 45 секунд</h2><blockquote>Мы готовили…<br>Коллега заметил…<br>Мы изменили…<br>Теперь материал можно использовать для…</blockquote><h3>Критерии завершения</h3>${['Есть собственный документ.','Учтено конкретное замечание коллеги.','Материал адаптирован к новому условию.','Педагог проверил результат.'].map((q,i)=>`<label><input type="checkbox" data-wg-check="${i}" ${workGame.checks[i]?'checked':''}> ${q}</label>`).join('')}</section></div>`;

function workGameAction(action,value){
 if(action==='wg-doc'){workGame.doc=Number(value);workGame.condition=null;render();}
 if(action==='wg-template')modal('Шаблон запроса',`<pre id="copyText">${esc(workTemplate)}</pre><button data-action="copy:modal" class="primary">Копировать шаблон</button><p>Учителя создают материалы в своих аккаунтах с выбранным плагином. Этот слайд не генерирует документы.</p>`);
 if(action==='wg-random'){const candidates=workConditionIds[workGame.doc].filter(i=>i!==workGame.condition);workGame.condition=candidates[Math.floor(Math.random()*candidates.length)];render();}
 if(action==='wg-list')modal('Выберите условие для своей пары',`<p>Тип документа: <strong>${workChoices[workGame.doc][1]}</strong>. Доступны подходящие ему карточки.</p><div class="wg-manual">${workConditions.map((q,i)=>`<button data-action="wg-condition:${i}" ${workConditionIds[workGame.doc].includes(i)?'':'disabled'} style="text-align:left;${workConditionIds[workGame.doc].includes(i)?'':'opacity:.45;cursor:not-allowed;'}">${workConditionHTML(i)}</button>`).join('')}</div>`);
 if(action==='wg-condition'){const condition=Number(value);if(!workConditionIds[workGame.doc].includes(condition))return;workGame.condition=condition;$('#dialog').close();render();}
}
document.addEventListener('input',e=>{if(e.target.id==='wgNote')workGame.notes=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='wgType'){workGame.doc=Number(e.target.value);workGame.condition=null;render();}if(e.target.dataset.wgCheck!==undefined)workGame.checks[Number(e.target.dataset.wgCheck)]=e.target.checked;});
