function tone(freq,duration=.12,volume=.035,type='sine'){const ac=context();if(!ac)return;const osc=ac.createOscillator(),gain=ac.createGain(),t=ac.currentTime;osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(volume,t+.015);gain.gain.exponentialRampToValueAtTime(.001,t+duration);osc.connect(gain);gain.connect(ac.destination);osc.start(t);osc.stop(t+duration+.02)}

function startMusic(){stopMusic();if(!music||slide.hidden||document.hidden)return;context();musicTimer=setInterval(()=>{if(!music||slide.hidden||document.hidden)return;tone(melody[noteIndex++%melody.length],.28,.014,'sine')},380)}
function musicLabel(){const b=document.getElementById('logic-music');b.setAttribute('aria-pressed',String(music));b.textContent=music?'♫ Музыка: қосулы':'♫ Музыка: өшірулі'}
document.getElementById('logic-music').addEventListener('click',()=>{music=!music;musicLabel();if(music)startMusic();else stopMusic();clickSound()});
document.getElementById('logic-sound').addEventListener('click',()=>{sound=!sound;const b=document.getElementById('logic-sound');b.setAttribute('aria-pressed',String(sound));b.textContent=sound?'♪ Дыбыс: қосулы':'♪ Дыбыс: өшірулі';clickSound()});
new MutationObserver(()=>{if(slide.hidden){stopMusic();if(dialog.open)dialog.close()}else startMusic()}).observe(slide,{attributes:true,attributeFilter:['hidden']});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic();else startMusic()});
function update(){const done=answers.filter(a=>a!==null).length,correct=answers.filter((a,i)=>a===bank[i][4]).length;document.getElementById('logic-correct').textContent=correct;document.getElementById('logic-wrong').textContent=done-correct;document.getElementById('logic-done').textContent=`${done} / ${bank.length}`;document.getElementById('logic-summary').textContent=done===bank.length?`Ойын аяқталды! Нәтиже: ${correct} / ${bank.length}. Қиын сұрақтардың шешімін бірге талқылаңыз.`:'Кез келген сұрақты таңдаңыз. Әр дұрыс жауап — 1 ұпай.';[...board.children].forEach((b,i)=>{const a=answers[i],done=a!==null;b.className='logic-tile'+(done?' completed '+(a===bank[i][4]?'good':'bad'):'');b.querySelector('.tile-status').textContent=done?(a===bank[i][4]?'✓':'✕'):'';b.setAttribute('aria-label',`${i+1}-сұрақ. ${bank[i][0]}. ${done?(a===bank[i][4]?'Дұрыс жауап берілді':'Қате жауап берілді'):'Жауап берілмеген'}`)})}
function party(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.getElementById('logic-sparkles');layer.replaceChildren();for(let i=0;i<16;i++){const s=document.createElement('span');s.className='logic-confetti';s.textContent=i%2?'✦':'●';s.style.setProperty('--left',(8+Math.random()*84)+'%');s.style.setProperty('--size',(16+Math.random()*22)+'px');s.style.setProperty('--color',['#FFDD70','#A9E7FF','#B9F09D','#E3BEFF'][i%4]);s.style.animationDelay=(Math.random()*.2)+'s';layer.append(s)}setTimeout(()=>layer.replaceChildren(),1600)}
function showFeedback(){const q=bank[active],a=answers[active],good=a===q[4];feedback.className='logic-feedback '+(good?'good':'bad');feedback.replaceChildren();const strong=document.createElement('strong');strong.textContent=good?'✓ Дұрыс! +1 ұпай':'✕ Қате жауап';const p=document.createElement('p');p.textContent=`Дұрыс жауап: ${q[3][q[4]]}. ${q[5]}`;feedback.append(strong,p);[...options.children].forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct-answer',i===q[4]);b.classList.toggle('wrong-answer',i===a&&!good);b.textContent=(i===q[4]?'✓ ':i===a?'✕ ':'')+q[3][i]})}
function openQuestion(i){clickSound();active=i;const q=bank[i];document.getElementById('logic-question-number').textContent=`${i+1} / ${bank.length} · ${q[0]}`;document.getElementById('logic-question-title').textContent=q[1];document.getElementById('logic-question').textContent=q[2];feedback.className='logic-feedback';feedback.replaceChildren();options.replaceChildren();q[3].forEach((answer,a)=>{const b=document.createElement('button');b.type='button';b.textContent=answer;b.addEventListener('click',()=>{if(answers[active]!==null)return;answers[active]=a;const good=a===q[4];answerSound(good);showFeedback();update();if(good)party()});options.append(b)});if(answers[i]!==null)showFeedback();dialog.showModal()}
board.replaceChildren();bank.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.className='logic-tile';const n=document.createElement('span');n.className='tile-number';n.textContent=String(i+1).padStart(2,'0');const topic=document.createElement('span');topic.className='tile-topic';topic.textContent=q[0];const status=document.createElement('span');status.className='tile-status';status.setAttribute('aria-hidden','true');b.append(n,topic,status);b.addEventListener('click',()=>openQuestion(i));board.append(b)});
function close(){clickSound();dialog.close()}
document.getElementById('logic-close').addEventListener('click',close);document.getElementById('logic-back').addEventListener('click',close);dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
document.getElementById('logic-reset').addEventListener('click',()=>{clickSound();answers=Array(bank.length).fill(null);feedback.replaceChildren();document.getElementById('logic-sparkles').replaceChildren();update()});
// Exported copies always start with a clean game and audio off.
musicLabel();document.getElementById('logic-sound').setAttribute('aria-pressed','true');document.getElementById('logic-sound').textContent='♪ Дыбыс: қосулы';dialog.removeAttribute('open');document.getElementById('logic-sparkles').replaceChildren();update();
})();
</script></body></html>
