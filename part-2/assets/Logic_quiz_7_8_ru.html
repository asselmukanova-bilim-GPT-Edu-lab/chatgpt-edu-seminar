function update(){const done=answers.filter(a=>a!==null).length,correct=answers.filter((a,i)=>a===bank[i][4]).length;document.getElementById('logic-correct').textContent=correct;document.getElementById('logic-wrong').textContent=done-correct;document.getElementById('logic-done').textContent=`${done} / ${bank.length}`;document.getElementById('logic-summary').textContent=done===bank.length?`Игра завершена! Результат: ${correct} / ${bank.length}. Обсудите вместе решения сложных вопросов.`:'Выберите любой вопрос. Каждый правильный ответ — 1 балл.';[...board.children].forEach((b,i)=>{const a=answers[i],done=a!==null;b.className='logic-tile'+(done?' completed '+(a===bank[i][4]?'good':'bad'):'');b.querySelector('.tile-status').textContent=done?(a===bank[i][4]?'✓':'✕'):'';b.setAttribute('aria-label',`Вопрос ${i+1}. ${bank[i][0]}. ${done?(a===bank[i][4]?'Дан правильный ответ':'Дан неверный ответ'):'Ответ не дан'}`)})}
function party(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.getElementById('logic-sparkles');layer.replaceChildren();for(let i=0;i<16;i++){const s=document.createElement('span');s.className='logic-confetti';s.textContent=i%2?'✦':'●';s.style.setProperty('--left',(8+Math.random()*84)+'%');s.style.setProperty('--size',(16+Math.random()*22)+'px');s.style.setProperty('--color',['#FFDD70','#A9E7FF','#B9F09D','#E3BEFF'][i%4]);s.style.animationDelay=(Math.random()*.2)+'s';layer.append(s)}setTimeout(()=>layer.replaceChildren(),1600)}
function showFeedback(){const q=bank[active],a=answers[active],good=a===q[4];feedback.className='logic-feedback '+(good?'good':'bad');feedback.replaceChildren();const strong=document.createElement('strong');strong.textContent=good?'✓ Верно! +1 балл':'✕ Неверный ответ';const p=document.createElement('p');p.textContent=`Правильный ответ: ${q[3][q[4]]}. ${q[5]}`;feedback.append(strong,p);[...options.children].forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct-answer',i===q[4]);b.classList.toggle('wrong-answer',i===a&&!good);b.textContent=(i===q[4]?'✓ ':i===a?'✕ ':'')+q[3][i]})}
function openQuestion(i){clickSound();active=i;const q=bank[i];document.getElementById('logic-question-number').textContent=`${i+1} / ${bank.length} · ${q[0]}`;document.getElementById('logic-question-title').textContent=q[1];document.getElementById('logic-question').textContent=q[2];feedback.className='logic-feedback';feedback.replaceChildren();options.replaceChildren();q[3].forEach((answer,a)=>{const b=document.createElement('button');b.type='button';b.textContent=answer;b.addEventListener('click',()=>{if(answers[active]!==null)return;answers[active]=a;const good=a===q[4];answerSound(good);showFeedback();update();if(good)party()});options.append(b)});if(answers[i]!==null)showFeedback();dialog.showModal()}
board.replaceChildren();bank.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.className='logic-tile';const n=document.createElement('span');n.className='tile-number';n.textContent=String(i+1).padStart(2,'0');const topic=document.createElement('span');topic.className='tile-topic';topic.textContent=q[0];const status=document.createElement('span');status.className='tile-status';status.setAttribute('aria-hidden','true');b.append(n,topic,status);b.addEventListener('click',()=>openQuestion(i));board.append(b)});
function close(){clickSound();dialog.close()}
document.getElementById('logic-close').addEventListener('click',close);document.getElementById('logic-back').addEventListener('click',close);dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
document.getElementById('logic-reset').addEventListener('click',()=>{clickSound();answers=Array(bank.length).fill(null);feedback.replaceChildren();document.getElementById('logic-sparkles').replaceChildren();update()});
// Exported copies always start with a clean game and audio off.
musicLabel();document.getElementById('logic-sound').setAttribute('aria-pressed','true');document.getElementById('logic-sound').textContent='♪ Звук: включён';dialog.removeAttribute('open');document.getElementById('logic-sparkles').replaceChildren();update();
})();
</script></body></html>
